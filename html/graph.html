<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph</title>
    <link rel="stylesheet" href="../css/graph.css">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body>

    <!-- header -->
    
    <header>
        <div class="header-left">
            <label>Wishor</label>
        </div>
        <div class="language-switcher" style="margin: 1rem;">
            <button id="btn-ru">Русский</button>
            <button id="btn-en">English</button>
        </div>
        <div class="header-right">
            <button class="wishes-button" translate-id="wishes">Wishes</button>
            <button class="logout-button" translate-id="logout">Logout</button>
        </div>
    </header>

    <!-- main -->

    <div id="status-distribution-chart-legend" class="legend">
        <div class="legend-item">
            <span class="legend-color" style="background-color: #3498db;"></span>
            <span class="legend-label" style="color: #3498db;" translate-id="new">New</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background-color: #e67e22;"></span>
            <span class="legend-label" style="color: #e67e22" translate-id="favorite">Favorite</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background-color: #2ecc71;"></span>
            <span class="legend-label" style="color: #2ecc71" translate-id="done">Done</span>
        </div>
    </div>
    <canvas id="status-distribution-chart" width="320" height="320"></canvas>

    <canvas id="wish-count-dynamics-chart" width="600" height="400"></canvas>
    
    <!-- scripts -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/wish.js"></script>
    <script src="../js/graph.js"></script>
    <script src="../js/localization.js"></script>
</body>
</html>
