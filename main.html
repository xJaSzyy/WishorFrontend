<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Wishor - Main</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>

<div id="mainContent">
    <input type="text" id="searchInput" class="search-input" placeholder="Search..." />

    <div class="filter">
        <button class="filter-status active" data-status="all">All</button>
        <button class="filter-status" data-status="0">New</button>
        <button class="filter-status" data-status="1">Favorite</button>
        <button class="filter-status" data-status="2">Done</button>
    </div>

    <div id="wishContainer">Loading...</div>
    <div class="navButtons">
        <button id="prevBtn">Prev</button>
        <button id="nextBtn">Next</button>
    </div>

    <button id="addWishBtn">Add Wish</button>

    <button id="logoutBtn" style="margin-top: 20px;">Logout</button>
</div>

<script>
    $(function() {
        let currentPage = 1;
        const pageSize = 5;
        let maxPage;
        let currentSearch = '';
        let currentStatus = null;

        const token = localStorage.getItem('jwtToken');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        $.ajax({
            url: 'http://localhost:5000/auth/validate',
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token
            },
            success: function(response) {
                if (!response.isSuccess) {
                    localStorage.removeItem('jwtToken');
                    window.location.href = 'login.html';
                } else {
                    loadWish(1);
                }
            },
            error: function() {
                localStorage.removeItem('jwtToken');
                window.location.href = 'login.html';
            }
        });

        function loadWish(page, search = '') {
            $('#wishContainer').hide();

            $.ajax({
                url: 'http://localhost:5000/wish',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
                },
                data: { Page: page, PageSize: pageSize, Search: search, Status: currentStatus },
                dataType: 'json',
                success: function(data) {
                    maxPage = data.content.maxPage;

                    let wishes = data.content.wishes;
                    if (wishes && wishes.length > 0) {
                        let html = '';
                        wishes.forEach(item => {
                            html += renderWishCard(item);
                        });
                        $('#wishContainer').html(html);
                        currentPage = page;
                        currentSearch = search;
                    } else {
                        $('#wishContainer').html('<p style="text-align:center; color:#555; font-style: italic;">Wishes not found</p>');
                    }

                    updateButtons();
                    updateFilterCounts();

                    $('#wishContainer').show();
                },
                error: function(jqXHR) {
                    if (jqXHR.status === 401) {
                        localStorage.removeItem('jwtToken');
                        window.location.href = 'login.html';
                        return;
                    }
                    $('#wishContainer').html('<p style="text-align:center; color:red;">Ошибка при загрузке желаний</p>');
                    updateButtons();
                    $('#wishContainer').show();
                }
            });
        }

        function updateFilterCounts() {
            $.ajax({
                url: 'http://localhost:5000/wish',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
                },
                data: { Page: 1, PageSize: 999 },
                dataType: 'json',
                success: function(data) {
                    let wishes = data.content.wishes;
                    
                    const counts = {0:0, 1:0, 2:0};

                    wishes.forEach(wish => {
                        if (counts.hasOwnProperty(wish.status)) {
                            counts[wish.status]++;
                        }
                    });

                    $('.filter-status').each(function() {
                        const status = $(this).data('status');
                        if (status !== 'all') {
                            $(this).text(() => {
                                let label = '';
                                switch (status) {
                                    case 0: label = 'New'; break;
                                    case 1: label = 'Favorite'; break;
                                    case 2: label = 'Done'; break;
                                    default: label = '';
                                }
                                return `${label} (${counts[status] || 0})`;
                            });
                        }
                    });
                },
                error: function(jqXHR) {
                    console.log(jqXHR);
                }
            });
        }

        function renderWishCard(wish) {
            const statusText = wish.status === 2 ? 'Done' : wish.status === 1 ? 'Favorite' : 'New';
            const statusColors = {
                0: '#3b82f6',   
                1: '#ec4899',   
                2: '#22c55e'    
            };
            return `
                <div class="wish-card" style="
                    flex: 1 1 280px; 
                    max-width: 340px;
                    border-radius: 16px;
                    border: 1px solid transparent;
                    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
                    padding: 24px 30px;
                    background: #fafafa;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    cursor: pointer;
                    transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                    min-height: 360px;
                "
                data-id="${wish.id}"
                onmouseover="this.style.boxShadow='0 12px 36px rgba(0,0,0,0.15)'; this.style.borderColor='${statusColors[wish.status] || statusColors[0]}'; this.style.transform='translateY(-6px) scale(1.03)';"
                onmouseout="this.style.boxShadow='0 8px 20px rgba(0,0,0,0.1)'; this.style.borderColor='transparent'; this.style.transform='translateY(0) scale(1)';"
                >
                    <span style="
                        align-self: flex-start;
                        color: #fff; 
                        background-color: ${statusColors[wish.status] || statusColors[0]};
                        padding: 6px 16px;
                        border-radius: 20px;
                        font-size: 0.9em;
                        font-weight: 700; 
                        box-shadow: 0 2px 8px rgba(0,0,0,0.16);
                        user-select: none;
                        letter-spacing: 0.05em;
                    ">${statusText}</span>
                    <h3 style="
                        margin-top: 16px;
                        margin-bottom: 12px;
                        color: #111;
                        font-size: 1.4em;
                        font-weight: 700;
                        line-height: 1.25em;
                        text-overflow: ellipsis;
                        overflow: hidden;
                        white-space: nowrap;
                    ">${wish.title || 'Untitled Wish'}</h3>
                    ${wish.description ? `<p style="
                        color: #555;
                        font-size: 1em;
                        line-height: 1.5em;
                        margin-bottom: 20px;
                        flex-grow: 1;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        max-height: 6em;
                    ">${wish.description}</p>` : `<div style="flex-grow:1;"></div>`}
                    ${wish.image ? `<img src="${wish.image}" alt="Wish image" style="
                        width: 100%;
                        border-radius: 12px;
                        object-fit: cover;
                        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
                        max-height: 180px;
                    ">` : ''}
                </div>
                `;
        }

        function updateButtons() {
            $('#prevBtn').prop('disabled', currentPage <= 1);
            $('#nextBtn').prop('disabled', currentPage >= maxPage);
        }

        $('.filter-status').click(function() {
            $('.filter-status').removeClass('active');

            $(this).addClass('active');

            currentStatus = $(this).data('status') === 'all' ? null : $(this).data('status');

            loadWish(1, currentSearch);
        });

        $('#prevBtn').click(function() {
            if (currentPage > 1) {
                loadWish(currentPage - 1, currentSearch);
            }
        });

        $('#nextBtn').click(function() {
            if (currentPage < maxPage) {
                loadWish(currentPage + 1, currentSearch);
            }
        });

        let debounceTimer;
        $('#searchInput').on('input', function() {
            clearTimeout(debounceTimer);
            let query = $(this).val();
            debounceTimer = setTimeout(() => {
                loadWish(1, query);
            }, 400);
        });
        
        $('#logoutBtn').click(function() {
            localStorage.removeItem('jwtToken');
            window.location.href = 'login.html';
        });

        $('#addWishBtn').click(function() {
            $('#addWishModal').css('display', 'flex');
            $('#addWishMessage').text('');
            
            $('#wishTitle').val('');
            $('#wishAuthor').val('');
            $('#wishDescription').val('');
            $('#wishStatus').val('0');
        });

        $('#cancelAddWish').click(function() {
            $('#addWishModal').hide();
        });

        $(document).keydown(function(e) {
            if (e.key === "Escape" && $('#addWishModal').is(':visible')) {
                $('#addWishModal').hide();
            }
        });
        
        $('#submitAddWish').click(function() {
            const title = $('#wishTitle').val().trim();
            const description = $('#wishDescription').val().trim();
            const status = parseInt($('#wishStatus').val());
            const image = $('#wishImage').val().trim();

            if (!title) {
                $('#addWishMessage').text('Title is required');
                return;
            }

            $.ajax({
                url: 'http://localhost:5000/wish',  
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken'),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify({ title, description, status, image }),
                success: function(response) {
                    if (response.isSuccess) {
                        $('#addWishModal').hide();
                        loadWish(1);  
                    } else {
                        $('#addWishMessage').text(response.message || 'Failed to add wish');
                    }
                },
                error: function(response) {
                    $('#addWishMessage').text(response.responseJSON.errorMessage);
                }
            });
        });

        $(document).on('click', '.wish-card', function() {
            const id = $(this).data('id'); 
            openEditWishModal(id);
        });

        let editingWishId = null;

        function openEditWishModal(wishId) {
            editingWishId = wishId;
            $('#editWishMessage').text('');
            $('#editWishModal').show();

            $.ajax({
                url: `http://localhost:5000/wish/${wishId}`,
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
                },
                success: function(data) {
                    const wish = data.content;
                    $('#editWishTitle').val(wish.title);
                    $('#editWishDescription').val(wish.description);
                    $('#editWishStatus').val(wish.status);
                    $('#editWishImage').val(wish.image);
                },
                error: function() {
                    $('#editWishMessage').text('Error loading wish details');
                }
            });
        }


        $('#cancelEditWish').click(function() {
            $('#editWishModal').hide();
            editingWishId = null;
        });

        $('#saveEditWish').click(function() {
            const updatedWish = {
                id: editingWishId,
                title: $('#editWishTitle').val().trim(),
                description: $('#editWishDescription').val().trim(),
                status: parseInt($('#editWishStatus').val()),
                image: $('#editWishImage').val().trim(),
            };

            if (!updatedWish.title) {
                $('#editWishMessage').text('Title is required');
                return;
            }

            $.ajax({
                url: `http://localhost:5000/wish/`,
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken'),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify(updatedWish),
                success: function(response) {
                    if (response.isSuccess) {
                        $('#editWishModal').hide();
                        editingWishId = null;
                        loadWish(currentPage);  
                    } else {
                        $('#editWishMessage').text(response.message || 'Failed to save changes');
                    }
                },
                error: function() {
                    $('#editWishMessage').text('Server error while saving changes');
                }
            });
        });

        $('#deleteEditWish').click(function() {
            if (!confirm('Are you sure you want to delete this wish?')) return;

            $.ajax({
                url: `http://localhost:5000/wish/${editingWishId}`,
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('jwtToken')
                },
                success: function(response) {
                    if (response.isSuccess) {
                        $('#editWishModal').hide();
                        editingWishId = null;
                        loadWish(1); 
                    } else {
                        $('#editWishMessage').text(response.message || 'Failed to delete wish');
                    }
                },
                error: function() {
                    $('#editWishMessage').text('Server error while deleting wish');
                }
            });
        });
        
    });
</script>

<div id="addWishModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 class="modal-title">Add Wish</h3>
        <input type="text" id="wishTitle" class="modal-input" placeholder="Title" />
        <textarea id="wishDescription" class="modal-textarea" placeholder="Description" rows="4"></textarea>
        <input type="url" id="wishImage" class="modal-input" placeholder="Image URL (optional)" />
        <select id="wishStatus" class="modal-select">
            <option value="0">New</option>
            <option value="1">Favorite</option>
            <option value="2">Done</option>
        </select>
        <div class="modal-buttons">
            <button id="cancelAddWish" class="btn btn-cancel">Cancel</button>
            <button id="submitAddWish" class="btn btn-submit">Add</button>
        </div>
        <div id="addWishMessage" class="modal-message"></div>
    </div>
</div>

<div id="editWishModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h3 class="modal-title">Edit Wish</h3>
        <input type="text" id="editWishTitle" class="modal-input" placeholder="Title" />
        <textarea id="editWishDescription" class="modal-textarea" placeholder="Description" rows="4"></textarea>
        <input type="url" id="editWishImage" class="modal-input" placeholder="Image URL (optional)" />
        <select id="editWishStatus" class="modal-select">
            <option value="0">New</option>
            <option value="1">Favorite</option>
            <option value="2">Done</option>
        </select>
        <div class="modal-buttons">
            <button id="cancelEditWish" class="btn btn-cancel">Cancel</button>
            <button id="saveEditWish" class="btn btn-submit">Save</button>
            <button id="deleteEditWish" class="btn btn-delete">Delete</button>
        </div>
        <div id="editWishMessage" class="modal-message"></div>
    </div>
</div>

</body>
</html>
